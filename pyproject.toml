[project]
name = "software-factory"
version = "0.1.0"
description = "Open-source agentic software factory: gates as code, independent review, state in files."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "cosmic-ray>=8.9",
    "coverage>=7.6",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["factory_installer", "gate", "mutate_python", "tests"]

[tool.ruff.lint.per-file-ignores]
# The launcher must parse on old Pythons (ADR 0002): no f-strings or annotations.
"install.py" = ["UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "kit/.factory/gates,kit/.factory/gates/tools"
files = ["factory_installer", "tests", "kit/.factory/gates/gate.py", "kit/.factory/gates/tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["kit/.factory/gates", "kit/.factory/gates/tools"]
addopts = "--strict-markers --ignore=tests/fixtures"
markers = ["ac(id): acceptance criterion from the E01 spec that this test covers"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["factory_installer", "kit/.factory/gates"]
