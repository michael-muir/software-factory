[project]
name = "software-factory"
version = "0.1.0"
description = "Open-source agentic software factory: gates as code, independent review, state in files."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "cosmic-ray>=8.9",
    "coverage>=7.6",
    "mypy>=1.13",
    "pytest>=8.3",
    "pytest-xdist>=3.8.0",
    "pyyaml>=6.0.3",
    "ruff>=0.8",
    "types-pyyaml>=6.0.12.20261113",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["factory_installer", "gate", "mutate_python", "mutate_ts", "run_hook", "tests"]

[tool.ruff.lint.per-file-ignores]
# The launcher must parse on old Pythons (ADR 0002): no f-strings or annotations.
"install.py" = ["UP"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "kit/.factory/gates,kit/.factory/gates/tools"
files = [
    "factory_installer",
    "tests",
    "kit/.factory/gates/gate.py",
    "kit/.factory/gates/tools",
    "kit/.factory/gates/hooks/run_hook.py",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["kit/.factory/gates", "kit/.factory/gates/tools"]
addopts = "--strict-markers --ignore=tests/fixtures -n auto"
markers = [
    "ac(id): acceptance criterion from a spec in docs/specs that this test covers",
    "slow: runs real tools through the gate; skip locally with -m \"not slow\"",
]
xfail_strict = true

[tool.coverage.run]
branch = true
# pytest-xdist workers are subprocesses; `coverage report` combines their data files.
patch = ["subprocess"]
source = ["factory_installer", "kit/.factory/gates"]

[tool.software-factory.mutation]
# Mutants tested per gate run (spec E06 AC-05b); the sample is deterministic.
max-mutants = 50
# Kill test: the fast suite only. Slow tests run real tools and take minutes each.
test-args = ["-m", "not slow"]
