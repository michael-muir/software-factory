[project]
name = "software-factory"
version = "0.1.0"
description = "Open-source agentic software factory: gates as code, independent review, state in files."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = []

[dependency-groups]
dev = [
    "coverage>=7.6",
    "mypy>=1.13",
    "pytest>=8.3",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["factory_installer", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers"
markers = ["ac(id): acceptance criterion from the E01 spec that this test covers"]
xfail_strict = true

[tool.coverage.run]
branch = true
source = ["factory_installer"]
