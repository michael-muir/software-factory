# Software Factory project configuration.
# Validate with: python install.py check

schema_version = 1

[hosting]
mode = "local"  # "local" | "cloud"

[budgets]
per_job_usd = 15  # > 0 and <= per_day_usd
per_day_usd = 120  # > 0
warn_at = 0.8  # fraction of budget; > 0 and <= halt_at
halt_at = 1.0  # fraction of budget; <= 1

[review]
max_rounds = 3  # 1 to 10

[gates]
coverage_threshold = 0.8  # 0 to 1
mutation_threshold = 0.6  # 0 to 1
mutation_scope = "changed-lines"  # "changed-lines" | "all"
profiles = []  # empty = auto-detect
base_ref = "main"  # branch that changed files are measured from
commit_checks = ["format", "lint", "types"]  # checks the pre-commit hook runs
python_command = ["python"]  # runs the gate, e.g. ["uv", "run", "python"]

[models]
cross_model_vendor = "openai"

[adapters]
tools = ["claude-code", "copilot", "cursor"]  # the coding tools build.py writes files for

[runner]
max_turns = 50  # commands per job; 1 to 10000
job_timeout_minutes = 120  # per job; > 0
max_parallel = 2  # jobs at once per daemon; 1 to 64
worktree_root = ""  # empty = "../<repo>.worktrees"

[jobs]
lease_minutes = 10  # a session's lease on a job; > 0
daemon_timeout_seconds = 60  # a daemon is dead after this long silent; >= 5

[telemetry]
enabled = false
